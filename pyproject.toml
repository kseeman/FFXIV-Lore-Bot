[project]
name = "xivlore"
version = "0.1.0"
description = "Compile a Final Fantasy XIV lore corpus and publish it as a Hugging Face dataset."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2",
    "pyarrow>=21",
]

[project.scripts]
xivlore = "xivlore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
